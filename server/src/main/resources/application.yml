server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: baskly-backend

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/baskly_money}"
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  auth:
    dev-mode: ${APP_AUTH_DEV_MODE:true}
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    jwt-validity-seconds: ${APP_AUTH_JWT_VALIDITY_SECONDS:86400}
    google:
      client-id: ${APP_AUTH_GOOGLE_CLIENT_ID:}
  nav:
    oracle:
      fetch-live: ${APP_NAV_ORACLE_FETCH_LIVE:true}
    scheduler:
      enabled: ${APP_NAV_SCHEDULER_ENABLED:true}
      fixed-rate-ms: ${APP_NAV_SCHEDULER_FIXED_RATE_MS:60000}
      initial-delay-ms: ${APP_NAV_SCHEDULER_INITIAL_DELAY_MS:5000}

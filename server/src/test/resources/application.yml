spring:
  application:
    name: baskly-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

app:
  auth:
    dev-mode: true
    jwt-secret: test-baskly-jwt-secret-key-32-chars-minimum-length!
    jwt-validity-seconds: 3600
  nav:
    oracle:
      fetch-live: false
    scheduler:
      enabled: false
